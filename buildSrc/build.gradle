plugins {
    id 'groovy'
    id 'maven-publish'
}

repositories {
    // Maven Central first for standard artifacts
    mavenCentral()

    // Architectury — required for loom and architectury plugin
    maven { url = 'https://maven.architectury.dev/' }

    // Fabric — required for fabric-related build tools
    maven { url = 'https://maven.fabricmc.net/' }

    // Forge Maven — required for Forge-specific build tools
    maven {
        name = 'Forge Maven'
        url = 'https://maven.minecraftforge.net/'
    }

    // NeoForge — required for NeoForge build tooling
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    compileOnly(libs.lombok)
    annotationProcessor(libs.lombok)

    implementation gradleApi()
    implementation localGroovy()

    implementation libs.bundles.asm
    implementation libs.commons.io

    implementation libs.loom
    implementation libs.bundles.lorenz
    implementation libs.mercury
    implementation libs.at

    implementation(libs.specialsource) { transitive false }
}